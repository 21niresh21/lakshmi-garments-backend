spring.application.name=lakshmi-garments

# DataSource configuration for MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/lg
spring.datasource.username=root
spring.datasource.password=admin
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JWT Configuration
lakshmigarments.app.jwtSecret=MWYyZDM0ZTU2N2c4aDlpMGoxazJsM200bjVvNnA3cTlyOHM5dDB1MXYydzN4NHk1eg==
lakshmigarments.app.jwtExpirationMs=28800000

# Hibernate (JPA) settings
spring.jpa.hibernate.ddl-auto=create
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.show_sql=false
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

# Hibernate SQL statements
logging.level.org.hibernate.SQL=ERROR
# Hibernate parameter bindings
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
# Entity flush events and internal listeners
logging.level.org.hibernate.engine.internal=ERROR
logging.level.org.hibernate.orm=ERROR

spring.threads.virtual.enabled=true
spring.main.lazy-initialization=true
# Maximum number of worker threads (default is 200)
# Setting this to 20-50 is often enough for low-traffic internal apps
server.tomcat.threads.max=20

# Minimum number of idle threads (default is 10)
server.tomcat.threads.min-spare=5

# How many requests to queue if all 50 threads are busy (default 100)
server.tomcat.accept-count=50

spring.security.enabled=false
logging.level.root=INFO
logging.level.com.lakshmigarments=DEBUG


